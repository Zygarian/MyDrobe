<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A90E2" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Baby blue background -->
  <circle cx="96" cy="96" r="92" fill="#ADD8E6" stroke="#87CEEB" stroke-width="4"/>
  
  <!-- White coat hanger silhouette -->
  <g fill="white">
    <!-- Hanger hook -->
    <ellipse cx="96" cy="38" rx="8" ry="12"/>
    
    <!-- Hanger bar -->
    <rect x="40" y="50" width="112" height="8" rx="4"/>
    
    <!-- Left hanger curve -->
    <path d="M 40 58 Q 30 70 50 80" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Right hanger curve -->
    <path d="M 152 58 Q 162 70 142 80" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Bottom bar -->
    <rect x="80" y="80" width="32" height="8" rx="4"/>
  </g>
  
  <!-- "M" and "D" initials - white with baby blue outline -->
  <g font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle">
    <!-- Blue outline (offset for glow effect) -->
    <text x="96" y="140" fill="#4A90E2">
      <tspan dx="-1" dy="-1">MD</tspan>
      <tspan dx="1" dy="-1">MD</tspan>
      <tspan dx="-1" dy="1">MD</tspan>
      <tspan dx="1" dy="1">MD</tspan>
    </text>
    
    <!-- White fill -->
    <text x="96" y="140" fill="white">MD</text>
  </g>
</svg>