<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDrobe v0.1</title>
    <style>
        :root {
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --text-sub: #666666;
            --accent: #000000;
            --border: #EAEAEA;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            padding-bottom: 40px;
        }
        header {
            padding: 24px 20px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }
        .version {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            padding: 16px 20px 8px;
        }
        .outfit-card {
            margin: 0 20px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 12px;
        }
        .items-col {
            flex: 1;
        }
        .outfit-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 8px;
        }
        .items-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }
        .item-box {
            min-width: 60px;
            height: 60px;
            background: #F4F4F4;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-sub);
            border: 1px dashed #CCC;
        }
        .preview-col {
            width: 60px;
            height: 120px;
            background: #F4F4F4;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-sub);
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .add-btn {
            display: block;
            width: calc(100% - 40px);
            margin: 20px;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 10;
            padding: 20px;
            display: none;
        }
        .modal.active { display: block; }
        .modal h2 { font-size: 22px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #F4F4F4;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
        }
        .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-save { background: var(--accent); color: white; }
        .btn-cancel { background: #F4F4F4; color: var(--text-main); }
        footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-sub);
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>MyDrobe</h1>
        <div class="version">v0.1 (Alpha)</div>
    </header>

    <div class="section-title">My Favourites</div>
    <div id="outfitList"></div>

    <button class="add-btn" onclick="openModal()">+ Add Outfit</button>

    <footer>MyDrobe &copy; 2024</footer>

    <div class="modal" id="addModal">
        <h2>New Outfit</h2>
        <div class="form-group">
            <label>Outfit Name</label>
            <input type="text" id="outfitName" placeholder="e.g. Casual Friday">
        </div>
        <div class="form-group">
            <label>Item 1</label>
            <input type="text" id="item1" placeholder="e.g. White Tee">
        </div>
        <div class="form-group">
            <label>Item 2</label>
            <input type="text" id="item2" placeholder="e.g. Denim Jeans">
        </div>
        <div class="form-group">
            <label>Item 3</label>
            <input type="text" id="item3" placeholder="e.g. Sneakers">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveOutfit()">Save Outfit</button>
        </div>
    </div>

    <script>
        // Local Storage Database
        const STORAGE_KEY = 'mydrobe_outfits_v0.1';

        function loadOutfits() {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const list = document.getElementById('outfitList');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = '<div style="padding:0 20px;color:#999;font-size:14px;text-align:center;">No outfits yet. Tap + to add one!</div>';
                return;
            }

            data.forEach((o, i) => {
                const card = document.createElement('div');
                card.className = 'outfit-card';
                card.innerHTML = `
                    <div class="items-col">
                        <div class="outfit-label">Outfit ${i + 1}: ${o.name}</div>
                        <div class="items-row">
                            <div class="item-box">${o.items[0]}</div>
                            <div class="item-box">${o.items[1]}</div>
                            <div class="item-box">${o.items[2]}</div>
                        </div>
                    </div>
                    <div class="preview-col">Preview</div>
                `;
                list.appendChild(card);
            });
        }

        function saveOutfit() {
            const name = document.getElementById('outfitName').value || 'New Outfit';
            const items = [
                document.getElementById('item1').value || 'Top',
                document.getElementById('item2').value || 'Bottom',
                document.getElementById('item3').value || 'Shoes'
            ];
            const outfits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            outfits.push({ name, items });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(outfits));
            closeModal();
            loadOutfits();
        }

        function openModal() { document.getElementById('addModal').classList.add('active'); }
        function closeModal() { document.getElementById('addModal').classList.remove('active'); }

        loadOutfits();
    </script>
</body>
</html>
