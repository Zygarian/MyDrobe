<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDrobe v0.1</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #FAFAFA; color: #111; margin: 0; padding: 20px; }
        header { text-align: center; border-bottom: 1px solid #EAEAEA; padding-bottom: 16px; margin-bottom: 24px; }
        h1 { font-size: 28px; font-weight: 800; margin: 0; }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .outfit-card { background: #FFF; border: 1px solid #EAEAEA; border-radius: 16px; margin-bottom: 16px; padding: 16px; cursor: pointer; }
        .outfit-header { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .outfit-body { display: none; margin-top: 16px; border-top: 1px solid #F0F0F0; padding-top: 16px; }
        .outfit-card.expanded .outfit-body { display: block; }
        .item-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        .upload-box { width: 60px; height: 60px; background: #F4F4F4; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 2px dashed #CCC; cursor: pointer; overflow: hidden; flex-shrink: 0; }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; }
        .item-input { flex: 1; padding: 12px; border: 1px solid #EAEAEA; border-radius: 10px; font-size: 14px; background: #FAFAFA; }
        .delete-btn { background: #F4F4F4; color: #111; border: none; padding: 10px; border-radius: 10px; font-size: 14px; width: 100%; margin-top: 8px; cursor: pointer; }
        .add-btn { background: #111; color: #FFF; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%; text-align: center; margin-bottom: 24px; cursor: pointer; }
        footer { text-align: center; font-size: 10px; color: #999; border-top: 1px solid #EAEAEA; padding-top: 16px; margin-top: 24px; }
        .empty-msg { text-align: center; color: #999; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header><h1>MyDrobe</h1></header>
    <div class="section-title">My Favourites</div>
    <div id="outfitList"></div>
    <div class="add-btn" onclick="addOutfit()">+ Add Outfit</div>
    <footer>MyDrobe © 2024 All Rights Reserved</footer>

    <script>
        const STORAGE_KEY = 'mydrobe_v01';

        function load() {
            let outfits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            let list = document.getElementById('outfitList');
            list.innerHTML = '';
            if (outfits.length === 0) {
                list.innerHTML = '<div class="empty-msg">No outfits yet. Tap + to add one!</div>';
                return;
            }
            outfits.forEach((o, i) => {
                let card = document.createElement('div');
                card.className = 'outfit-card';
                card.onclick = function() { this.classList.toggle('expanded'); };

                let itemsHtml = '';
                for(let j=0; j<3; j++) {
                    let name = o.items[j]?.name || '';
                    let img = o.items[j]?.img || '';
                    let boxContent = img ? `<img src="${img}">` : '+';
                    itemsHtml += `<div class="item-row">
                        <div class="upload-box" id="box_${i}_${j}" onclick="event.stopPropagation(); document.getElementById('file_${i}_${j}').click()">${boxContent}</div>
                        <input type="text" class="item-input" value="${name}" placeholder="Item name (optional)" onchange="updateItem(${i}, ${j}, 'name', this.value)">
                        <input type="file" id="file_${i}_${j}" accept="image/*" capture="environment" style="display:none" onchange="handleImage(this, ${i}, ${j})">
                    </div>`;
                }

                itemsHtml += `<button class="delete-btn" onclick="event.stopPropagation(); deleteOutfit(${i})">Remove Outfit</button>`;
                card.innerHTML = `<div class="outfit-header">Outfit ${i+1}: ${o.name} <span style="font-size:12px; color:#999">▼</span></div><div class="outfit-body">${itemsHtml}</div>`;
                list.appendChild(card);
            });
        }

        function addOutfit() {
            let outfits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            outfits.push({ name: 'New Outfit', items: [{name: 'Top'}, {name: 'Bottom'}, {name: 'Shoes'}] });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(outfits));
            load();
        }

        function updateItem(oIndex, iIndex, field, value) {
            let outfits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if(outfits[oIndex].items[iIndex]) outfits[oIndex].items[iIndex][field] = value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(outfits));
        }

        function handleImage(input, oIndex, iIndex) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let outfits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    if(!outfits[oIndex].items[iIndex]) outfits[oIndex].items[iIndex] = {};
                    outfits[oIndex].items[iIndex].img = e.target.result;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(outfits));
                    let box = document.getElementById(`box_${oIndex}_${iIndex}`);
                    box.innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function deleteOutfit(i) {
            let outfits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            outfits.splice(i, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(outfits));
            load();
        }

        load();
    </script>
</body>
</html>
