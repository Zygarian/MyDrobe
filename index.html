<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyDrobe v0.2</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #FAFAFA; color: #111; padding-bottom: 140px; }
header { padding: 24px 20px 16px; text-align: center; border-bottom: 1px solid #EAEAEA; }
h1 { margin: 0; font-size: 28px; font-weight: 800; }
.card { background: #FFF; border: 1px solid #EAEAEA; border-radius: 16px; padding: 16px; margin-bottom: 14px; position: relative; margin: 0 20px; }
.card-star { position: absolute; top: 16px; right: 16px; font-size: 20px; cursor: pointer; color: #CCC; }
.card-star.active { color: #FFD700; }
.add-btn { position: fixed; bottom: 100px; right: 20px; width: 56px; height: 56px; background: #111; color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; z-index: 50; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
.btn-primary { background: #111; color: #FFF; }
.btn-secondary { background: #F4F4F4; color: #111; }
.tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: #FFF; border-top: 1px solid #EAEAEA; padding: 12px 0; }
.tab { flex: 1; text-align: center; background: none; border: none; font-size: 15px; font-weight: 600; color: #999; cursor: pointer; padding: 8px; }
.tab.active { color: #111; }
footer { text-align: center; font-size: 10px; color: #999; padding: 16px; border-top: 1px solid #EAEAEA; }
.photo-input { width: 100%; padding: 24px; border: 2px dashed #CCC; border-radius: 12px; text-align: center; background: #F9F9F9; margin-bottom: 16px; font-size: 14px; color: #999; cursor: pointer; }
.add-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #FAFAFA; z-index: 150; overflow-y: auto; padding: 20px; display: none; }
</style>
</head>
<body>
<header><h1>MyDrobe</h1></header>
<div id="outfits"></div>
<div id="favs" style="display:none"></div>
<div class="tabs">
    <button class="tab active" onclick="showTab('outfits')">Outfits</button>
    <button class="tab" onclick="showTab('favs')">My Favourites</button>
</div>
<footer>MyDrobe © 2026 All Rights Reserved | v0.2</footer>

<div class="add-btn" onclick="openAdd()">+</div>

<div class="add-screen" id="addScreen">
    <h2 style="margin-top:0;padding:20px;">Add Outfit</h2>
    <div style="padding:0 20px;">
        <label style="font-weight:600;font-size:14px;margin-bottom:8px;display:block;">Full Body Shot</label>
        <input type="file" class="photo-input" accept="image/*" capture="environment" id="fullBodyInput">
        <div id="fullBodyPreview"></div>
        
        <label style="font-weight:600;font-size:14px;margin-bottom:8px;display:block;">Items</label>
        <div id="itemsContainer"></div>
        <button class="btn btn-secondary" onclick="addItem()">+ Add Item</button>
        <button class="btn btn-primary" onclick="saveOutfit()">Save Outfit</button>
        <button class="btn btn-secondary" onclick="closeAdd()">Cancel</button>
    </div>
</div>

<script>
let outfits = JSON.parse(localStorage.getItem('md_v02') || '[]');
let tempData = { fullBody: null, items: [] };

document.getElementById('fullBodyInput').addEventListener('change', function() {
    if(this.files[0]) {
        let reader = new FileReader();
        reader.onload = function(e) {
            tempData.fullBody = e.target.result;
            document.getElementById('fullBodyPreview').innerHTML = `<img src="${e.target.result}" style="width:100px;height:150px;object-fit:cover;border-radius:10px;display:block;margin-bottom:16px;">`;
        };
        reader.readAsDataURL(this.files[0]);
    }
});

function addItem() {
    let idx = tempData.items.length;
    tempData.items.push({ type: 'Shirt', name: '', img: null });
    
    let row = document.createElement('div');
    row.style.marginBottom = '16px';
    
    let photoInput = document.createElement('input');
    photoInput.type = 'file';
    photoInput.className = 'photo-input';
    photoInput.accept = 'image/*';
    photoInput.capture = 'environment';
    photoInput.addEventListener('change', function() {
        if(this.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                tempData.items[idx].img = e.target.result;
                let img = document.createElement('img');
                img.src = e.target.result;
                img.style.cssText = 'width:100px;height:100px;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px;';
                this.parentNode.insertBefore(img, this);
                this.style.display = 'none';
            };
            reader.readAsDataURL(this.files[0]);
        }
    });
    row.appendChild(photoInput);
    
    let select = document.createElement('select');
    select.style.cssText = 'width:100%;padding:10px;border:1px solid #EAEAEA;border-radius:8px;font-size:14px;background:#FFF;margin-bottom:8px;';
    select.innerHTML = '<option>Shirt</option><option>Hoodie</option><option>Pants</option><option>Shoes</option><option>Scarf</option><option>Hat</option>';
    select.addEventListener('change', function() { tempData.items[idx].type = this.value; });
    row.appendChild(select);
    
    let nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'Item name (optional)';
    nameInput.style.cssText = 'width:100%;padding:10px;border:1px solid #EAEAEA;border-radius:8px;font-size:14px;background:#FFF;';
    nameInput.addEventListener('change', function() { tempData.items[idx].name = this.value; });
    row.appendChild(nameInput);
    
    document.getElementById('itemsContainer').appendChild(row);
}

function openAdd() {
    tempData = { fullBody: null, items: [] };
    document.getElementById('itemsContainer').innerHTML = '';
    document.getElementById('fullBodyPreview').innerHTML = '';
    document.getElementById('fullBodyInput').style.display = 'block';
    document.getElementById('addScreen').style.display = 'block';
}

function closeAdd() { document.getElementById('addScreen').style.display = 'none'; }

function saveOutfit() {
    outfits.push({ fullBody: tempData.fullBody, items: tempData.items, fav: false });
    localStorage.setItem('md_v02', JSON.stringify(outfits));
    closeAdd();
    render();
}

function toggleFav(i) {
    outfits[i].fav = !outfits[i].fav;
    localStorage.setItem('md_v02', JSON.stringify(outfits));
    render();
}

function rm(i) {
    outfits.splice(i, 1);
    localStorage.setItem('md_v02', JSON.stringify(outfits));
    render();
}

function showTab(t) {
    document.getElementById('outfits').style.display = t === 'outfits' ? 'block' : 'none';
    document.getElementById('favs').style.display = t === 'favs' ? 'block' : 'none';
    let tabs = document.querySelectorAll('.tab');
    tabs.forEach(b => b.classList.remove('active'));
    if(t === 'outfits') tabs[0].classList.add('active');
    else tabs[1].classList.add('active');
}

function render() {
    let oDiv = document.getElementById('outfits');
    let fDiv = document.getElementById('favs');
    oDiv.innerHTML = '';
    fDiv.innerHTML = '';
    
    if(outfits.length === 0) {
        oDiv.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">No outfits yet.<br>Tap <b>+</b> to add one!</div>';
        fDiv.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">No favourites yet.</div>';
        return;
    }
    
    outfits.forEach((o, i) => {
        let itemsHtml = '';
        if(o.items && o.items.length > 0) {
            o.items.forEach(item => {
                let thumb = item.img ? `<img src="${item.img}" style="width:50px;height:50px;object-fit:cover;border-radius:10px;">` : '+';
                itemsHtml += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                    <div style="width:50px;height:50px;background:#F4F4F4;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">${thumb}</div>
                    <div style="flex:1;font-size:14px;">${item.type}${item.name ? ': ' + item.name : ''}</div>
                </div>`;
            });
        }
        let fullBodyHtml = '';
        if(o.fullBody) {
            fullBodyHtml = `<img src="${o.fullBody}" style="width:100%;height:auto;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:10px;">`;
        }
        let cardHtml = `<div class="card">
            <span class="card-star ${o.fav ? 'active' : ''}" onclick="toggleFav(${i})">★</span>
            <div style="font-size:16px;font-weight:600;margin-bottom:8px;">Outfit ${i+1}</div>
            ${fullBodyHtml}
            ${itemsHtml}
            <button class="btn btn-secondary" onclick="rm(${i})">Remove Outfit</button>
        </div>`;
        oDiv.innerHTML += cardHtml;
        if(o.fav) fDiv.innerHTML += cardHtml;
    });
    
    if(!fDiv.innerHTML) {
        fDiv.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">No favourites yet.</div>';
    }
}

render();
</script>
</body>
</html>
